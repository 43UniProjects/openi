[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openi"
version = "1.0.0"
description = "An AI-driven museum security system that provides real-time threat detection, suspect tracking, and automated incident reporting."
authors = [
    { name = "Malith Banuka", email = "malithbanukasubsinghe@gmail.com" },
    { name = "Janindu Malshan", email = "janindumalshan123@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # AI, Computer Vision & Tracking
    "lap>=0.5.12",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "openvino>=2024.0.0",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.209",

    # Dashboard & Networking
    "httpx>=0.28.1",
    "nicegui>=1.4.0",
    "requests>=2.34.2",

    # Data, Plotting & System Utilities
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
    "psutil>=7.2.2",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
]

[project.scripts]
openi = "openi.main:main"
openi-gui = "openi.gui.dashboard:launch_dashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import sorting), W: warnings
select = ["E", "F", "I", "W"]
ignore = [
    "E501", # Ignore line length violations (let the formatter handle it)
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
