[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openi"
version = "1.0.0"
description = "An AI-driven museum security system that provides real-time threat detection, suspect tracking, and automated incident reporting."
authors = [
    { name = "Janindu Malshan" },
    { name = "Malith Banuka", email = "malithbanukasubsinghe@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "cloudpickle==3.1.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock>=3.32.7",
    "fonttools==4.65.0",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "Jinja2==3.1.6",
    "kiwisolver==1.5.1",
    "MarkupSafe==3.0.3",
    "matplotlib==3.11.2",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.3",
    "nvidia-ml-py==13.610.43",
    "nicegui>=1.4.0",
    "opencv-python==5.0.0.93",
    "openvino>=2024.0.0",
    "packaging==26.3",
    "pillow==12.3.0",
    "polars==1.44.2",
    "polars-runtime-32==1.44.2",
    "psutil==7.2.2",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "six==1.17.0",
    "sympy==1.14.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "typing_extensions==4.16.0",
    "ultralytics==8.4.156",
    "ultralytics-platform==0.1.48",
    "ultralytics-thop==2.1.6",
    "urllib3==2.8.0"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff"
]

[project.scripts]
openi = "openi.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import sorting), W: warnings
select = ["E", "F", "I", "W"]
ignore = [
    "E501", # Ignore line length violations (let the formatter handle it)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
