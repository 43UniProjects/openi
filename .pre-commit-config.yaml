repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"] # prevent committing files with size >= 5MB
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"] # prevent direct commits to main branch

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff # run linting
        args: [--fix]
      - id: ruff-format # run formatting

  # enforce standard commit msg format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.1.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
